<script>
(function(){
  function initCarousel(root){
    const track = root.querySelector('.carousel-track');
    const viewport = root.querySelector('.carousel-viewport');
    const dots = root.querySelector('.dots');
    const originals = Array.from(track.querySelectorAll('.slide'));
    const count = originals.length;
    if (!count) return;

    let slides = originals;
    let physicalIndex = 0;
    let timer = null;
    let isSnapping = false;

    if (count > 1) {
      const firstClone = originals[0].cloneNode(true);
      const lastClone = originals[count - 1].cloneNode(true);
      firstClone.classList.add('is-clone');
      lastClone.classList.add('is-clone');
      track.insertBefore(lastClone, originals[0]);
      track.appendChild(firstClone);
      slides = Array.from(track.querySelectorAll('.slide'));
      physicalIndex = 1; // 첫 번째 실제 카드를 중앙에 배치하고, 좌측에는 마지막 카드 클론을 살짝 노출
    }

    for (let i = 0; i < count; i += 1) {
      const button = document.createElement('button');
      button.className = 'dot';
      button.type = 'button';
      button.setAttribute('aria-label', (i + 1) + '번째 배너');
      button.addEventListener('click', function(){ goTo(i, true); });
      dots.appendChild(button);
    }

    const dotButtons = Array.from(dots.children);

    function logicalIndex(){
      if (count <= 1) return 0;
      if (physicalIndex === 0) return count - 1;
      if (physicalIndex === count + 1) return 0;
      return physicalIndex - 1;
    }

    function setTransition(enabled){
      track.style.transition = enabled ? '' : 'none';
    }

    function update(animate){
      const slide = slides[physicalIndex];
      if (!slide) return;
      setTransition(animate !== false);
      const left = slide.offsetLeft - (viewport.clientWidth - slide.clientWidth) / 2;
      track.style.transform = 'translateX(' + (-left) + 'px)';

      const current = logicalIndex();
      dotButtons.forEach(function(dot, i){ dot.classList.toggle('active', i === current); });
      slides.forEach(function(item, i){ item.classList.toggle('active', i === physicalIndex); });

      if (animate === false) {
        requestAnimationFrame(function(){ setTransition(true); });
      }
    }

    function snapIfNeeded(){
      if (count <= 1 || isSnapping) return;
      if (physicalIndex === 0) {
        isSnapping = true;
        physicalIndex = count;
        update(false);
        requestAnimationFrame(function(){ isSnapping = false; });
      } else if (physicalIndex === count + 1) {
        isSnapping = true;
        physicalIndex = 1;
        update(false);
        requestAnimationFrame(function(){ isSnapping = false; });
      }
    }

    function move(delta, manual){
      if (count <= 1) return;
      physicalIndex += delta;
      update(true);
      if (manual) restart();
    }

    function goTo(index, manual){
      if (count <= 1) return;
      physicalIndex = index + 1;
      update(true);
      if (manual) restart();
    }

    function restart(){
      clearInterval(timer);
      const ms = Number(root.dataset.autoplay || 0);
      if (ms && count > 1) timer = setInterval(function(){ move(1, false); }, ms);
    }

    root.querySelector('.prev')?.addEventListener('click', function(){ move(-1, true); });
    root.querySelector('.next')?.addEventListener('click', function(){ move(1, true); });
    track.addEventListener('transitionend', function(event){
      if (event.propertyName === 'transform') snapIfNeeded();
    });
    window.addEventListener('resize', function(){ update(false); });
    window.addEventListener('load', function(){ update(false); });

    requestAnimationFrame(function(){ update(false); restart(); });
  }

  document.querySelectorAll('.carousel').forEach(initCarousel);
})();
</script>
